name: Test ZAP Baseline Scan - Issue Writing Enabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          target: 'http://example.com'
          allow_issue_writing: 'true'
          fail_action: 'false'
          docker_name: 'ghcr.io/zaproxy/zaproxy:stable'
          artifact_name: 'zap_scan_issue'
          issue_title: 'ZAP Scan Baseline Report'

      - name: Assert action ran with issue writing enabled
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # With allow_issue_writing=true, the action will attempt to create/update a
          # GitHub issue. This will fail with the sentinel repo (not a real repo),
          # so we expect either success (if the scan completes and issue creation is
          # skipped gracefully) or failure (due to API 404 on sentinel repo).
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed successfully"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable for issue creation)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
