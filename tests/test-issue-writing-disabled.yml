name: Test ZAP Baseline Scan - Issue Writing Disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          target: 'https://www.example.com'
          fail_action: false
          allow_issue_writing: false
          issue_title: 'ZAP Test Scan Report'
          artifact_name: 'zap_scan_no_issue'
          cmd_options: '-I'

      - name: Assert action ran without attempting issue creation
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # With allow_issue_writing=false, the action should not attempt to create
          # a GitHub issue (which would fail with the sentinel repository).
          # The action should either succeed or fail gracefully (e.g. Docker unavailable).
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed without issue writing"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected in restricted environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
