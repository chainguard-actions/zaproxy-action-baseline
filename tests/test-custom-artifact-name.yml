name: Test ZAP Baseline Scan - Custom Artifact Name
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          target: 'https://www.example.com'
          docker_name: 'ghcr.io/zaproxy/zaproxy:stable'
          allow_issue_writing: 'false'
          fail_action: 'false'
          artifact_name: 'my_custom_zap_report'

      - name: Assert action accepted custom artifact name
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should accept a custom artifact_name without error.
          # Success means ZAP ran and produced a report named 'my_custom_zap_report'.
          # Failure may occur in constrained environments (no Docker access).
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with custom artifact name"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran but failed (may be infra constraint)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
