name: Test ZAP Baseline Scan - Custom Artifact Name
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          target: 'https://www.example.com'
          fail_action: false
          allow_issue_writing: false
          artifact_name: 'my_custom_zap_report'
          cmd_options: '-I'

      - name: Assert action ran with custom artifact name
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should accept a custom artifact_name without error.
          # In a restricted environment, it may fail gracefully.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed with custom artifact name"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected in restricted environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
