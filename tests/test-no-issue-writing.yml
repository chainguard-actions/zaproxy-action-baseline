name: Test ZAP Baseline Scan - Issue Writing Disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          target: 'https://www.example.com'
          allow_issue_writing: 'false'
          fail_action: 'false'
          issue_title: 'ZAP Scan Test Report'
          artifact_name: 'zap_scan_no_issue'
      - name: Assert action ran without attempting issue creation
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # With allow_issue_writing=false, the action should not attempt to create
          # a GitHub issue (which would fail due to the sentinel repo).
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded without issue writing"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected under harness constraints)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
