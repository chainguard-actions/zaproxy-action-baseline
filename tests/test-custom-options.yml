name: Test ZAP Baseline Scan - Custom Options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          target: 'https://www.example.com'
          allow_issue_writing: 'false'
          fail_action: 'false'
          artifact_name: 'my_custom_zap_report'
          issue_title: 'Custom ZAP Scan Report'
          cmd_options: '-I'
      - name: Assert action ran with custom options
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # Verify the action accepts custom artifact_name, issue_title, and cmd_options
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed with custom options"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected in restricted environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
