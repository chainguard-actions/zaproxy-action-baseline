name: Test ZAP Baseline Scan - Fail Action Disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          target: 'http://example.com'
          allow_issue_writing: 'false'
          fail_action: 'false'
          docker_name: 'ghcr.io/zaproxy/zaproxy:stable'
          artifact_name: 'zap_scan_no_fail'

      - name: Assert action ran with fail_action disabled
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # With fail_action=false, ZAP alerts should NOT cause the action to fail.
          # The action may still fail due to sentinel repo API calls in processReport,
          # but it should not fail due to ZAP alerts themselves.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed successfully with fail_action=false"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected with sentinel repo or network constraints)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
