name: Test ZAP Baseline Scan - Fail Action Disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          target: 'https://www.example.com'
          allow_issue_writing: 'false'
          fail_action: 'false'
          artifact_name: 'zap_scan_no_fail'
      - name: Assert action ran with fail_action disabled
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # With fail_action=false, the action should not fail due to alerts.
          # It may still fail in restricted environments (no Docker, sentinel repo).
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed without failing (fail_action=false respected)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected in restricted environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
