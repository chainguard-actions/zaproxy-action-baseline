name: Test ZAP Baseline Scan - Rules File
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          target: 'https://www.example.com'
          docker_name: 'ghcr.io/zaproxy/zaproxy:stable'
          allow_issue_writing: 'false'
          fail_action: 'false'
          artifact_name: 'zap_scan_rules_file'
          rules_file_name: 'hardened/tests/fixtures/zap-rules.tsv'

      - name: Assert action accepted rules_file_name input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should accept a rules_file_name without error.
          # Success means ZAP ran using the provided rules configuration.
          # Failure may occur in constrained environments (no Docker access, network issues).
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with rules_file_name"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran but failed (may be infra constraint)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
