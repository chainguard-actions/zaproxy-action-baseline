name: Test ZAP Baseline Scan with rules_file_name
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Prepare rules file
        run: |
          cp "$GITHUB_WORKSPACE/hardened/tests/fixtures/zap-rules.tsv" "$GITHUB_WORKSPACE/zap-rules.tsv"
          echo "Rules file prepared at: $GITHUB_WORKSPACE/zap-rules.tsv"
          ls -la "$GITHUB_WORKSPACE/zap-rules.tsv"

      - id: action
        uses: .
        continue-on-error: true
        with:
          target: 'https://www.example.com'
          rules_file_name: 'zap-rules.tsv'
          allow_issue_writing: 'false'
          fail_action: 'false'

      - name: Assert action ran with rules_file_name input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with rules_file_name input"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected in act environment without full Docker/ZAP setup)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
