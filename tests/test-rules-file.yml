name: Test rules_file_name input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create ZAP rules file
        run: |
          cat > "$GITHUB_WORKSPACE/zap-rules.tsv" << 'EOF'
          10016	IGNORE	(Web Browser XSS Protection Not Enabled)
          10020	IGNORE	(X-Frame-Options Header Not Set)
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          target: 'https://example.com'
          rules_file_name: 'zap-rules.tsv'
          allow_issue_writing: false
          fail_action: false

      - name: Assert action ran with rules_file_name input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with rules_file_name input (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
